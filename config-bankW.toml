# N64Recomp config for streamed-overlay bank unit W (Phase 4).
# See config-bankR.toml for the model. This unit holds the combat bank of record
# 9's arena (RAM 0x80214FA0):
#   ROM 0x17F9E0 (0x91A0) -> RAM 0x80214FA0 (see config-bankW.yaml).

[input]
output_func_path = "BankWFuncs"
elf_path = "build/bankW.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
