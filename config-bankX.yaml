# Secondary splat config: streamed-overlay bank unit X (Phase 4).
#
# Unit X holds the module **scene 0x0E** (the battle scene) streams into record
# 10's arena. It is the third bank of RAM 0x801E6FD0:
#
#   bankRec10b  ROM 0x23B1F0 (0x09580) -> RAM 0x801E6FD0   (unit C)
#   bankRec10c  ROM 0x22A250 (0x10120) -> RAM 0x801E6FD0   (this unit)
#
# Found (session 72) from the same developer-driven combat run as unit W. The
# battle transition reached scene `0x0D`'s engine and the port logged
#
#   [bank] loading overlay record rom=0x213AE0 ram=0x801D0860 size=0x16770 (147 functions)
#   [bank] UNKNOWN module rom=0x22A250 ram=0x801E6FD0 (0x801E6FD0 is also where rom=0x23B1F0 loads)
#   [overlays] streamed function stub called @ 0x801EFACC
#
# The loader is the main unit's `func_80177754` (scene 0x0E's enter; the battle
# engine calls it as a subroutine), at instruction level:
#
#   func_800900C0(0x801E6FD0, 0x801F68F0-0x801E6FD0 = 0xF920)   ; code icache
#   func_80090010(0x801F68F0, 0x801F70F0-0x801F68F0 = 0x800)    ; data dcache
#   func_8009DA50(rom=0x22A250, ram=0x801E6FD0, size=0x23A370-0x22A250 = 0x10120)
#   func_80093380(0x801F70F0, 0x801F70F0)                        ; no bss
#
# So code is ROM 0x22A250..0x239B70 -> RAM 0x801E6FD0..0x801F68F0, data to
# RAM 0x801F70F0, and there is no BSS. The module's data half is graphic/tile
# data with no plain strings; it is a code module (the loader invalidates icache
# and the battle `jal`s its entries).
#
# The three addresses the battle calls that are real entries in this module's
# own layout are forced in symbol_addrs-bankX.txt: 0x801EBCA0, 0x801EFACC,
# 0x801F0104. Code size 0xF920 is a multiple of 16 (no assembler pad).
#
# See config-bankA.yaml for the model, config-bankV/W.yaml for the siblings.

name: Ogre Battle 64 - streamed overlay bank unit X
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankX
  target_path: assets/ogre64.z64
  elf_path: build/bankX.elf
  base_path: .
  platform: n64
  compiler: KMC

  asm_path: build/bankX/asm
  build_path: build/bankX
  asset_path: build/bankX/assets
  ld_script_path: build/bankX.ld
  undefined_syms_auto_path: build/bankX/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankX/undefined_funcs_auto.txt
  symbol_addrs_path:
    - symbol_addrs-bankX.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlX_$VRAM"
  symbol_name_format_no_rom: "ovlX_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's ROM position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # The battle bank: code to the loader's dcache base, then the data half.
  - name: bankRec10c
    type: code
    start: 0x22A250
    vram: 0x801E6FD0
    subsegments:
      - [0x22A250, asm]
      - [0x239B70, data]

  # The loader's size ends here (ROM 0x23A370); unit C's bankRec10b (ROM
  # 0x23B1F0) follows a gap.
  - [0x23A370]
