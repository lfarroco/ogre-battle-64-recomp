# Build a release for every platform and attach it to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# It publishes a release with one archive per platform attached, so the
# downloads appear on the repository's Releases page. Run it by hand
# (`workflow_dispatch`) with `draft: true` to get a draft you publish yourself.
# One asset per platform: `.tar.gz` on macOS and Linux, `.zip` on Windows.
#
# ---------------------------------------------------------------------------
# WHERE THE RECOMPILED GAME CODE COMES FROM
# ---------------------------------------------------------------------------
# This repository deliberately does NOT contain the recompiler's output
# (RecompiledFuncs/, Bank*Funcs/, RspFuncs/, app/src/bank_funcs.inc are
# gitignored). That is ~62 MB of C generated from a ROM, and generating it needs
# the ROM. There are two ways to give a runner that code:
#
#   1. Self-hosted runner (the default). The matrix `runs-on` uses the
#      self-hosted labels, and the machine must already have run
#      `make recomp && make bank-recomp` against a ROM.
#
#   2. GitHub-hosted runner. Set this repository's Actions variable
#      `OGRE_DATA_REPO` to the slug of the private data repository, and add the
#      secret `OGRE_DATA_TOKEN` (a fine-grained token with `Contents: Read` on
#      that repository). Every matrix job then switches to `matrix.hosted`,
#      clones the data repository and unpacks `files.tar.gz` from it.
#
# The archive for path 2 is produced on a machine with the ROM by
# `tools/data-bundle.sh`; docs/guides/app-build.md -> "Releases (GitHub Actions)"
# documents the contract, and docs/HANDOFF-2026-09-19-session89.md the reason.
#
# Either way `tools/release-build.sh` checks that the generated code is present
# and tells you exactly what is missing.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft instead of publishing it'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Empty OGRE_DATA_REPO -> the self-hosted labels, where the generated code
    # already exists. Set -> the hosted label, plus the private data repository
    # that supplies the generated code. `vars` is one of the contexts GitHub
    # allows in `runs-on`.
    runs-on: ${{ vars.OGRE_DATA_REPO != '' && matrix.hosted || fromJSON(matrix.fallback) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos
            hosted: macos-14
            fallback: '["self-hosted","macOS","ARM64"]'
            archive: ogre-battle-64-recomp-macos-arm64.tar.gz
            flavour: tar.gz
            cmake_args: ''
            dist_dir: dist-macos
          - name: Linux (x86-64)
            os: linux
            hosted: ubuntu-24.04
            fallback: '["self-hosted","Linux","X64"]'
            archive: ogre-battle-64-recomp-linux-x86_64.tar.gz
            flavour: tar.gz
            cmake_args: ''
            dist_dir: dist-linux
          - name: Windows (x86-64)
            os: windows
            hosted: windows-2022
            fallback: '["self-hosted","Windows","X64"]'
            archive: ogre-battle-64-recomp-windows-x86_64.zip
            flavour: zip
            # cl.exe rejects the GCC/Clang spellings the app, the runtime and
            # RT64 use for their flags (cl : error D8021), so build with clang-cl
            # in an MSVC environment, the configuration Zelda64Recomp uses.
            cmake_args: '-G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
            dist_dir: dist-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Fail with the missing name rather than a checkout error, when the
      # variable is set and the token is not.
      - name: Check the data repository configuration
        if: vars.OGRE_DATA_REPO != ''
        shell: bash
        env:
          TOKEN: ${{ secrets.OGRE_DATA_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::OGRE_DATA_REPO is set to '${{ vars.OGRE_DATA_REPO }}' but the OGRE_DATA_TOKEN secret is empty or missing. Add a fine-grained token with Contents: Read on that repository."
            exit 1
          fi

      - name: Fetch the generated game code
        if: vars.OGRE_DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OGRE_DATA_REPO }}
          token: ${{ secrets.OGRE_DATA_TOKEN }}
          path: ogre-data

      - name: Unpack the generated game code
        if: vars.OGRE_DATA_REPO != ''
        shell: bash
        run: |
          set -e
          tar xzf ogre-data/files.tar.gz -C .
          # A bundle packed on macOS can carry AppleDouble `._*` members, which
          # extract as ordinary files here. app/CMakeLists.txt globs `*.c`, so
          # they would be compiled and fail with `stray '\5' in program`.
          # tools/data-bundle.sh no longer writes them; delete them anyway, so
          # an existing bundle works.
          find . -name '._*' -delete
          find . -name '.DS_Store' -delete
          for p in RecompiledFuncs app/src/bank_funcs.inc RspFuncs; do
            test -e "$p" || { echo "::error::$p is missing from files.tar.gz"; exit 1; }
          done
          banks=$( (ls -d Bank*Funcs 2>/dev/null || true) | wc -l | tr -d ' ')
          [ "$banks" -gt 0 ] || { echo "::error::Bank*Funcs/ is missing from files.tar.gz"; exit 1; }
          echo "RecompiledFuncs: $(find RecompiledFuncs -type f | wc -l | tr -d ' ') files"
          echo "Bank units:      $banks"
          echo "RspFuncs:        $(find RspFuncs -type f | wc -l | tr -d ' ') files"
          if [ -f ogre-data.txt ]; then
            cat ogre-data.txt
            recorded=$(sed -n 's/^public commit: //p' ogre-data.txt)
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$recorded" ] && [ "$recorded" != "$GITHUB_SHA" ]; then
              echo "::warning::the generated code was bundled at $recorded, but this release builds $GITHUB_SHA"
            fi
          fi

      # RT64 is a git submodule and is already here. tools/N64ModernRuntime is
      # gitignored, so a GitHub-hosted runner has none: clone the pinned
      # upstream commit and apply the same two root patches a developer applies.
      # A self-hosted runner already has it and skips that.
      - name: Prepare third-party trees
        shell: bash
        run: |
          set -e
          N64MODERNRUNTIME_COMMIT=589bbf018a3e6d3646ddf7de1e7919f1b7e99bb1
          if [ ! -d tools/N64ModernRuntime ]; then
            echo "==> cloning N64ModernRuntime at $N64MODERNRUNTIME_COMMIT"
            git clone https://github.com/N64Recomp/N64ModernRuntime.git tools/N64ModernRuntime
            git -C tools/N64ModernRuntime checkout "$N64MODERNRUNTIME_COMMIT"
            git -C tools/N64ModernRuntime submodule update --init --recursive
            ( cd tools/N64ModernRuntime && git apply ../../n64modernruntime-ob64.patch )
            ( cd tools/N64ModernRuntime/N64Recomp && git apply ../../../n64modernruntime-n64recomp.patch )
          fi
          if [ -f rt64-plume-sdl.patch ] && [ -d tools/RT64/src/contrib/plume ]; then
            git -C tools/RT64/src/contrib/plume apply ../../../../rt64-plume-sdl.patch 2>/dev/null || true
          fi

      # A hosted runner checks out the RT64 and plume submodules pristine, so it
      # needs the project's patches applied the way a developer's tree has them.
      # A self-hosted runner already has them, so this step is for the hosted
      # path; `apply_patch` skips a patch that is already in the tree.
      - name: Patch the RT64 submodules
        if: vars.OGRE_DATA_REPO != ''
        shell: bash
        run: |
          set -e
          # apply_patch <directory> <patch path relative to that directory>
          #
          # --ignore-whitespace compares the hunk context with the carriage
          # returns ignored. A Windows runner checks the submodule out with CRLF,
          # and without the flag `git apply` fails on a hunk whose last line has
          # no newline (`\ No newline at end of file`; rt64-ob64.patch has two,
          # in rt64_tmem_hasher.h and rt64_native_target.cpp).
          apply_patch() {
            if ( cd "$1" && git apply --reverse --check --ignore-whitespace "$2" ) >/dev/null 2>&1; then
              echo "==> already applied: $2"
            else
              ( cd "$1" && git apply --ignore-whitespace "$2" )
              echo "==> applied $2"
            fi
          }
          apply_patch tools/RT64 ../../rt64-ob64.patch
          apply_patch tools/RT64/src/contrib/plume ../../../../../rt64-plume-ob64.patch
          apply_patch tools/RT64/src/contrib/plume ../../../../../tools/rt64-plume-sdl.patch

      # The runner images ship CMake and a C++ compiler, but not everything the
      # builds below need. These steps run on the hosted path only; a self-hosted
      # runner already has its toolchain (docs/guides/app-build.md -> Releases
      # carries the per-platform list).
      - name: Install Linux build dependencies
        if: vars.OGRE_DATA_REPO != '' && matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libvulkan-dev libx11-dev

      # The Metal compiler is a separate download from Xcode 16 on. Probe first,
      # so an image that already has it is untouched.
      - name: Ensure the macOS Metal toolchain
        if: vars.OGRE_DATA_REPO != '' && matrix.os == 'macos'
        shell: bash
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "==> metal compiler already available"
          else
            echo "==> downloading the Metal toolchain"
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      # release-build.sh drives `make dist`; the Windows image has no make, and
      # the app builds with clang-cl under Ninja (see matrix.cmake_args).
      - name: Install Windows build dependencies
        if: vars.OGRE_DATA_REPO != '' && matrix.os == 'windows'
        shell: bash
        run: choco install make ninja -y --no-progress

      # clang-cl needs the MSVC headers, libraries and linker. This exports the
      # Visual Studio developer environment to the steps that follow, exactly as
      # in Zelda64Recomp's Windows job.
      - name: Set up the MSVC developer environment
        if: vars.OGRE_DATA_REPO != '' && matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and package
        shell: bash
        env:
          DIST_OS: ${{ matrix.os }}
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: tools/release-build.sh

      - name: Collect the archive
        shell: bash
        run: |
          set -e
          mkdir -p "${{ matrix.dist_dir }}"
          # release-build.sh writes both flavours when both tools exist (tar is
          # in Git Bash, zip is in the macOS/Linux images), so pick the one this
          # platform ships instead of copying the loop's last match over the
          # matrix name -- that left the zip under a `.tar.gz` name.
          src="dist/ogre-battle-64-recomp-${{ matrix.os }}.${{ matrix.flavour }}"
          test -f "$src" || { echo "::error::$src was not produced"; exit 1; }
          cp "$src" "${{ matrix.dist_dir }}/${{ matrix.archive }}"
          echo "collected $src"
          ls -lh "${{ matrix.dist_dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.dist_dir }}/*
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what will be attached
        run: ls -lh artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -e
          # A tag push publishes; workflow_dispatch can ask for a draft.
          draft_args=()
          if [ "${DRAFT:-false}" = "true" ]; then
            draft_args+=(--draft)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            # Publishing a release that a previous run left as a draft.
            if [ "${DRAFT:-false}" != "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              "${draft_args[@]}" \
              --title "Ogre Battle 64: Recomp $TAG" \
              --notes "$(cat <<'NOTES'
          Native builds of the port for the platforms below.

          **These packages contain no game data.** You must supply your own
          Ogre Battle 64 (USA, Rev A) ROM dump; the app asks for it on first
          launch ("Click to load your ROM") and stores it beside itself after
          validating it by hash. Saves are written to `saves/` next to the
          executable.

          See the README inside each archive, and the repository README for
          build instructions and the full list of environment options.
          NOTES
          )"
          fi
