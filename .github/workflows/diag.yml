name: Diag

# Temporary: find out why a GUI-subsystem exe launched from Git Bash on the
# windows-2022 runner exits 127. Deleted once answered.
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: A trivial GUI-subsystem exe, run from Git Bash
        shell: bash
        run: |
          cat > g.c <<'EOF'
          #include <windows.h>
          int WINAPI WinMain(HINSTANCE a, HINSTANCE b, LPSTR c, int d) { return 7; }
          EOF
          clang-cl /nologo /MT /c g.c || echo "compile failed"
          link /nologo /subsystem:windows /out:g.exe g.obj || echo "link failed"
          ls -l g.exe 2>/dev/null || true
          ./g.exe; echo "gui-bash exit=$?"
          ./g.exe >/tmp/g.log 2>&1; echo "gui-bash-redirect exit=$?"

      - name: "v0.2.0 release exe: loader probe from Git Bash"
        shell: bash
        run: |
          mkdir -p rel && cd rel
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*windows*' --dir . || echo "download failed"
          unzip -q -o *.zip
          cd ogre-battle-64-recomp
          ls -l ogrebattle64.exe
          probe() {
            local label="$1"
            ./ogrebattle64.exe >/tmp/probe.log 2>&1 &
            local pid=$!
            sleep 12
            if kill -0 "$pid" 2>/dev/null; then echo "$label: LOADED (still running after 12 s)"; kill -9 "$pid" 2>/dev/null; wait "$pid" 2>/dev/null; else wait "$pid" 2>/dev/null; echo "$label: exit=$?"; fi
          }
          probe "v020-plain"

          redist=$(ls -d "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC"/*/x64/Microsoft.VC1*.CRT 2>/dev/null | head -1)
          echo "redist=$redist"
          for d in msvcp140.dll msvcp140_atomic_wait.dll vcruntime140.dll vcruntime140_1.dll; do
            [ -f "$redist/$d" ] && cp "$redist/$d" . && echo "copied $d"
          done
          file msvcp140.dll 2>/dev/null || true
          probe "v020-with-crt"
