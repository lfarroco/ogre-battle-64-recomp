name: Diag

# Temporary: find out why a GUI-subsystem exe launched from Git Bash on the
# windows-2022 runner exits 127. Deleted once answered.
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Console and GUI exes built with lld-link, run from Git Bash
        continue-on-error: true
        shell: bash
        run: |
          set +e
          printf 'int main(void){return 7;}\n' > c.c
          cat > g.c <<'EOF'
          #include <windows.h>
          int WINAPI WinMain(HINSTANCE a, HINSTANCE b, LPSTR c, int d) { return 9; }
          EOF
          lld-link -nologo -subsystem:console -out:c.exe c.c
          echo "console-link=$?"
          lld-link -nologo -subsystem:windows -out:g.exe g.c
          echo "gui-link=$?"
          ls -l c.exe g.exe
          ./c.exe; echo "console exit=$?"
          ./g.exe; echo "gui exit=$?"

      - name: Existing GUI exe (notepad) from Git Bash
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /c/Windows/System32/notepad.exe &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then echo "notepad LOADED"; kill -9 "$pid" 2>/dev/null; else wait "$pid" 2>/dev/null; echo "notepad exited $?"; fi

      - name: "v0.2.0 exe: real exit status from PowerShell"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p rel && cd rel
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*windows*' --dir .
          unzip -q -o '*.zip'
          app="$(cygpath -w "$PWD/ogre-battle-64-recomp/ogrebattle64.exe")"
          echo "app=$app"
          powershell -NoProfile -Command "
            \$p = Start-Process -FilePath '$app' -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 6
            if (\$p.HasExited) { 'exited code={0} hex=0x{0:X8}' -f \$p.ExitCode }
            else { 'RUNNING'; \$p.Kill() }
          "
          echo "powershell=$?"
