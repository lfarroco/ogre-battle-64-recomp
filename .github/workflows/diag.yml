name: Diag

# Temporary: find the faulting module of the startup fast-fail (0xC0000409).
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-2022
    steps:
      - name: Run the v0.2.0 exe and read the Application Error event
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p rel && cd rel
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*windows*' --dir .
          unzip -q -o '*.zip'
          app="$(cygpath -w "$PWD/ogre-battle-64-recomp/ogrebattle64.exe")"
          echo "app=$app"
          powershell -NoProfile -Command "
            \$p = Start-Process -FilePath '$app' -PassThru
            Start-Sleep -Seconds 8
            if (\$p.HasExited) { 'exited code={0} hex=0x{0:X8}' -f \$p.ExitCode } else { 'RUNNING'; \$p.Kill() }
          "
          echo "---- Application Error events ----"
          powershell -NoProfile -Command "
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 3 -ErrorAction SilentlyContinue |
              ForEach-Object { '=== ' + \$_.TimeCreated; \$_.Message }
          "
          echo "---- WER events ----"
          powershell -NoProfile -Command "
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Windows Error Reporting'} -MaxEvents 3 -ErrorAction SilentlyContinue |
              ForEach-Object { '=== ' + \$_.TimeCreated; \$_.Message }
          "
