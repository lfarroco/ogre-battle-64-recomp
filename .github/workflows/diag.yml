name: Diag

# Temporary: stack at the ucrtbase fast-fail, via cdb.
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-2022
    steps:
      - name: cdb stack of the v0.2.0 fast-fail
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p rel && cd rel
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*windows*' --dir .
          unzip -q -o '*.zip'
          cd ogre-battle-64-recomp
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          "$cdb" -o -g -G -c "g; .ecxr; kb; q" ogrebattle64.exe > cdb.log 2>&1
          echo "cdb exit=$?"
          echo "=========== cdb.log ==========="
          cat cdb.log
