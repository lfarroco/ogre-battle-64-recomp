# Secondary splat config: streamed-overlay bank unit T (Phase 4).
#
# Unit T holds the **tutorial practice module** — the second bank of record 18's
# arena, streamed when the tutorial (scene 0x17) opens its practice stage. The
# other bank of that RAM is record 18 itself (unit B):
#
#   rec18   ROM 0x1BA020 (0x92B0) -> RAM 0x80220F60..0x8022A210   (unit B)
#   rec18b  ROM 0x1C32D0 (0x5D50) -> RAM 0x8022A860..0x802305B0   (this unit)
#
# rec18's segment-table entry declares `ram_end 0x80230600`, so 0x8022A860 sits
# inside record 18's *BSS*; the game's own loader for it is record 18's
# `func_ovlB_80221D50` (ROM 0x1BA020 + 0x10E30), which indexes a 0x28-byte
# descriptor table at RAM 0x80229DDC by the mode word `D_80193700`:
#
#   D_80193700 = 1 -> entry 0x80229E04:
#       { ram 0x8022A860, ram_end 0x802305F0,
#         rom 0x001C32D0, rom_end 0x001C9020,
#         bss 0x802305B0..0x802305F0,
#         code 0x8022A860..0x8022CBF0, data 0x8022CBF0..0x802305B0 }
#
#   DMA: func_8009DA50(0x1C32D0, 0x8022A860, 0x1C9020-0x1C32D0 = 0x5D50)
#   entry: jalr into the mode table's +0x08 word at 0x80229EAC = 0x8022AA94
#   (code/data/bss invalidated and zeroed around it, at 0x80221E1C..0x80221E64)
#
# `D_80193700` is also the word that selects scene 0x03's *practice* descriptor
# (0x8018F364, mask 0x0004038C = records 2,3,7,8,9 **and 18**) over the normal
# mission descriptor (0x8018F350, mask 0x0000038C). Same RAM is shared with
# unit C's record 14 (0x802258B0), the uncompiled record 16, and units K/L's
# bankRec14a/d (0x8022ACB0), so this module gets its own unit and the runtime's
# DMA-driven bank map decides which bank runs at those addresses (session 45).
#
# Found (session 71) by driving the tutorial: with the tutorial scene forced and
# A pressed through Deneb's dialogue, the run entered the practice scene 0x03
# (descriptor 0x8018F364) and logged
#
#   [overlays] streamed function stub called @ 0x8022A860 / 0x8022A88C /
#              0x8022AA94 / 0x8022B36C
#
# instead of the tutorial's instructions and enemy units — the developer's
# "placed in a map and nothing happens, without enemies". The module's data half
# carries the tutorial instruction text ("Stationing unit will gather
# information.", "This will end the instruction on Stronghold Command.
# Proceed?", "This concludes the tutorial on Use Item command. Proceed?") and
# the enemy/unit constructor strings.
#
# Code/data: the boundary is the game's own — the loader table's `code_end`
# 0x8022CBF0 is ROM 0x1C5660, which is the last `jr ra` (0x1C5658) plus its
# delay slot and the first string. Code size 0x2390 is a multiple of 16, so the
# assembler adds no `.text` pad (session 65's +8 trap).
#
# See config-bankA.yaml for the model, config-bankR.yaml for the closest sibling.

name: Ogre Battle 64 - streamed overlay bank unit T
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankT
  target_path: assets/ogre64.z64
  elf_path: build/bankT.elf
  base_path: .
  platform: n64
  compiler: KMC

  # Keep every output out of the other units' trees.
  asm_path: build/bankT/asm
  build_path: build/bankT
  asset_path: build/bankT/assets
  ld_script_path: build/bankT.ld
  undefined_syms_auto_path: build/bankT/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankT/undefined_funcs_auto.txt
  symbol_addrs_path:
    - symbol_addrs-bankT.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlT_$VRAM"
  symbol_name_format_no_rom: "ovlT_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's ROM position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # The tutorial practice module: code to the loader table's code_end
  # (ROM 0x1C5660), then the data half with the instruction strings and tables.
  - name: bankRec18b
    type: code
    start: 0x1C32D0
    vram: 0x8022A860
    subsegments:
      - [0x1C32D0, asm]
      - [0x1C5660, data]

  # The other bank of this arena (ROM 0x1C9020..) is not compiled yet; bound the
  # subsegment so it cannot run to the end of the ROM.
  - [0x1C9020]
