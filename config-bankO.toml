# N64Recomp config for streamed-overlay bank unit O (Phase 4).
# See config-bankM.toml for the model. This unit holds bankRec6 alone
# (ROM 0xFA600, 0x7700 -> RAM 0x801AD5C0), moved out of unit A in session 67 so
# unit A's record 3 call into 0x801AD6BC compiles as LOOKUP_FUNC instead of
# binding to unit A's own record-6 body (see config-bankO.yaml).

[input]
output_func_path = "BankOFuncs"
elf_path = "build/bankO.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
