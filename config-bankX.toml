# N64Recomp config for streamed-overlay bank unit X (Phase 4).
# See config-bankR.toml for the model. This unit holds the battle bank of record
# 10's arena (RAM 0x801E6FD0):
#   ROM 0x22A250 (0x10120) -> RAM 0x801E6FD0 (see config-bankX.yaml).

[input]
output_func_path = "BankXFuncs"
elf_path = "build/bankX.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
