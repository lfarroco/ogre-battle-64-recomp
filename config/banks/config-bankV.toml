# N64Recomp config for streamed-overlay bank unit V (Phase 4).
# See config/banks/config-bankR.toml for the model. This unit holds the settings/options menu
# module the mission streams into record 9's arena when the screen is opened:
#   ROM 0x1A4BE0 (0x14680) -> RAM 0x80214FA0 (see config/banks/config-bankV.yaml).

[input]
output_func_path = "../../BankVFuncs"
elf_path = "../../build/bankV.elf"
rom_file_path = "../../assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
