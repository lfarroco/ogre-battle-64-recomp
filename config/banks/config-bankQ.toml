# N64Recomp config for streamed-overlay bank unit Q (Phase 4).
# See config/banks/config-bankM.toml for the model. This unit holds the second module the
# mission scene (0x03) streams into record 9's arena:
#   ROM 0x165FE0 (0xBEE0) -> RAM 0x80214FA0 (see config/banks/config-bankQ.yaml).

[input]
output_func_path = "../../BankQFuncs"
elf_path = "../../build/bankQ.elf"
rom_file_path = "../../assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
