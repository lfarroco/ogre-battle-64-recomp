# N64Recomp config for streamed-overlay bank unit AH (Phase 4).
# See config/banks/config-bankI.toml for the same-RAM sibling. Battle/setup fragment the
# battle scene (0x0E) streams into record 10's arena:
#   ROM 0x23A370 (0xE80) -> RAM 0x801D0860 (see config/banks/config-bankAH.yaml).

[input]
output_func_path = "../../BankAHFuncs"
elf_path = "../../build/bankAH.elf"
rom_file_path = "../../assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

# No size overrides: splat splits this fragment cleanly (code 0xE70 / data
# 0x10) and the three real entries are forced in config/symbols/symbol_addrs-bankAH.txt.
function_sizes = []
