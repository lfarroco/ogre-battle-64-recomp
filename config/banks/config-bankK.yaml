# Secondary splat config: streamed-overlay bank unit K (Phase 4).
#
# Unit K holds the **third** bank of the record-14 arena: the module the
# New Game opening streams over RAM 0x8022ACB0 for the sequence step whose
# command is `-8` (step 1073 = the "Prologue" chapter animation, the step the
# game reaches after the closing intro movie):
#
#   bankRec14d  ROM 0x286BA0 (0x138F0) -> RAM 0x8022ACB0
#               code -> 0x8023DE30, data -> 0x8023E5A0, bss -> 0x8023E630
#
# The other bank of that RAM is unit L's `bankRec14a` (ROM 0x29A490, 0xE860),
# which the *other* sequence steps load (the movie/cathedral steps). The two
# cannot share an ELF, and neither may live in unit C: unit C compiles record 14
# (the resident engine module at 0x802258B0) whose code calls into 0x8022ACB0+
# (the interpreter `func_ovlC_802282D8` calls 0x8022C270/0x8022C6E4; the
# command-`-8` setup callback `func_ovlC_80225F60` calls 0x8022E3F0). While
# bankRec14a was part of unit C those calls were bound at build time to
# rec14a's bodies, so when the game DMA'd this module over that RAM (which it
# does for step 1073) the interpreter ran rec14a's layout at those addresses —
# the session-45/55/58 mis-binding class, and this session's crash.
#
# The load, instruction level: `func_ovlC_8022683C`'s command `-8` arm at
# 0x802269DC computes ROM 0x286BA0 -> RAM 0x8022ACB0 size 0x138F0 (the `subu`
# at 0x80226A28 gives 0x29A490-0x286BA0), invalidates code 0x8022ACB0..0x8023DE30
# and data 0x8023DE30..0x8023E5A0, then `func_ovlC_80093380(0x8023E5A0, 0x90)`
# zeroes the bss. The code/data boundary is the game's own (and the last `jr ra`
# is at 0x8023DE1C). Verified live: an `OGRE_DUMP_RDRAM` at the crash has RAM
# 0x8022ACB0 byte-identical to ROM 0x286BA0, and the step word D_8018F1C0 =
# 0x0431.
#
# See config/banks/config-bankA.yaml for the model and docs/HANDOFF-2026-09-15-session45.md.

name: Ogre Battle 64 - streamed overlay bank unit K
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankK
  target_path: assets/ogre64.z64
  elf_path: build/bankK.elf
  base_path: ../..
  symbol_addrs_path:
    - config/symbols/symbol_addrs.txt
  reloc_addrs_path:
    - config/symbols/reloc_addrs.txt
  platform: n64
  compiler: KMC

  # Keep every output out of the other units' trees.
  asm_path: build/bankK/asm
  build_path: build/bankK
  asset_path: build/bankK/assets
  ld_script_path: build/bankK.ld
  undefined_syms_auto_path: build/bankK/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankK/undefined_funcs_auto.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlK_$VRAM"
  symbol_name_format_no_rom: "ovlK_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's rom position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # The chapter-animation module. Code/data split at the game's own cache
  # boundary (ROM 0x299D20 == RAM 0x8023DE30); the data half holds the module's
  # tables and string fragments.
  - name: bankRec14d
    type: code
    start: 0x286BA0
    vram: 0x8022ACB0
    subsegments:
      - [0x286BA0, asm]
      - [0x299D20, data]

  # bankRec14a (unit L) begins here; not part of this unit.
  - [0x29A490]
