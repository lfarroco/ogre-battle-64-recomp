# Secondary splat config: streamed-overlay bank unit I (Phase 4).
#
# Unit I holds the code module **scene 0x16** (the New Game opening's closing
# movie) streams into record 10's arena:
#
#   bankRec16   ROM 0x244770 (0x07500) -> RAM 0x801D0860
#
# The earlier module that occupies the *same* RAM for the other scenes
# (bankRec10a, ROM 0x213AE0) is **unit J** — they are two *banks* of one range,
# so they cannot share a unit. That range is inside record 10's arena (record 10
# is ROM 0x1F0A00 -> RAM 0x801AD5C0, `ram_end` 0x801F7100), which unit C
# compiles; and — the session-45 rule — a swappable range must not be *defined*
# in the unit whose code calls into it, or N64Recomp binds the call to one
# bank's bodies and the other bank's callers run them with the wrong
# frame/register contract.
#
# Scene 0x16 is the closing movie of the New Game opening (the scene the
# sequence reaches after the personality questions). Its descriptor is
# 0x8018FC00 with record mask 0x400 (record 10). Its enter chunk-DMAs
# ROM 0x244770 -> RAM 0x801D0860 in 0x200-byte chunks (59 of them, verified by
# `OGRE_DMA_TRACE=1` + `OGRE_DMA_TRACE_FULL=1`: rom=0x244770 ram=0x801D0860
# ... rom=0x24BB70 ram=0x801D7C60), which covers the whole gap between
# bankRec10b (ends 0x244770) and record 11 (starts 0x24BC70). The port had no
# code for it, so its calls into 0x801D40D0/0x801D410C/0x801D62A0 hit the
# runtime's streamed stub and spun (session 57 §2). It is now bank unit I and
# the resident calls into it are dispatched (`make recomp`'s --only list).
#
# `bankRec10a` was part of unit C until this session; it moved here so the two
# banks of RAM 0x801D0860 live in different units (unit C may not define a range
# its own code calls into). The module's own boundaries: code up to
# `func_ovlI_801D747C`/`801D7484` and the data (jump tables, a pointer table,
# the string fragments at 0x801D7D00) from 0x801D74D0, i.e. ROM 0x24BBD0 —
# splat's own split. See docs/HANDOFF-2026-09-16-session58.md.
#
# See config/banks/config-bankA.yaml for the model and docs/DECISIONS.md (sessions 45, 55).

name: Ogre Battle 64 - streamed overlay bank unit I
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankI
  target_path: assets/ogre64.z64
  elf_path: build/bankI.elf
  base_path: ../..
  symbol_addrs_path:
    - config/symbols/symbol_addrs.txt
  reloc_addrs_path:
    - config/symbols/reloc_addrs.txt
  platform: n64
  compiler: KMC

  # Keep every output out of the other units' trees.
  asm_path: build/bankI/asm
  build_path: build/bankI
  asset_path: build/bankI/assets
  ld_script_path: build/bankI.ld
  undefined_syms_auto_path: build/bankI/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankI/undefined_funcs_auto.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlI_$VRAM"
  symbol_name_format_no_rom: "ovlI_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's rom position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # Gap: unit J's bankRec10a (ROM 0x213AE0, the *other* bank of RAM 0x801D0860)
  # and unit C's bankRec10b (ROM 0x23B1F0) are different arena modules.
  - type: bin
    start: 0x213AE0
    vram: 0x213AE0

  # Scene 0x16's module: code 0x6C70 (-> 0x801D74D0), data 0x8A0
  # (-> 0x801D7D60, the module's RAM end). The whole thing is 0x7500, exactly
  # the gap before record 11's ROM 0x24BC70. The boundary is splat's own: the
  # last function is `func_ovlI_801D7484` (ends ROM 0x24B3E0) and 0x801D74D0 is
  # its first `dlabel`. The data labels the code loads (0x801D7D60/64/68/6C,
  # module end) live in the data half, which is why the split cannot simply be
  # at the first pointee.
  - name: bankRec16
    type: code
    start: 0x244770
    vram: 0x801D0860
    subsegments:
      - [0x244770, asm]
      - [0x24B3E0, data]

  # Rest of the ROM: record 11 (ROM 0x24BC70) starts another unit's records.
  - [0x24BC70]
