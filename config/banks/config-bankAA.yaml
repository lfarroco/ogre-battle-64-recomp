# Secondary splat config: streamed-overlay bank unit AA (Phase 4).
#
# Unit AA holds one bank of record 9's arena at RAM 0x80214FA0 (the arena
# units P/Q/R/V/W and their siblings share):
#
#   rec9aa  ROM 0x18f120 (0x06310) -> RAM 0x80214fa0
#
# Found (session 72) by enumerating every `func_8009DA50` arena load in unit N's
# record 7 (`func_ovlN_801AExxx`); record 9's arena has **thirteen** banks and
# the port had compiled only five:
#
#   0x165FE0 Q   0x171EC0 P   0x177EF0 AA   0x17F9E0 W   0x188B80 ..
#   0x18F120 ..  0x195430 R   0x1977B0 ..        0x19C730 ..  0x1A2BF0 ..
#   0x1A4BE0 V   0x1A9260 ..  0x1B2640 ..
#
# The loader (unit N's `func_800900C0`/`func_80090010`/`func_8009DA50`/
# `func_80093380` arm) gives the game's own boundaries:
#
#   code  RAM 0x80214fa0..0x8021b190  ROM 0x18f120..0x195310
#   data  RAM ..0x8021b2b0            ROM ..0x195430
#   DMA   func_8009DA50(0x18f120, 0x80214fa0, 0x6310)
#   bss   RAM 0x8021b2b0..0x8021b360
#
# Code size 0x61f0 is a multiple of 16 (no assembler pad).
#
# See config/banks/config-bankA.yaml for the model.

name: Ogre Battle 64 - streamed overlay bank unit AA
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankAA
  target_path: assets/ogre64.z64
  elf_path: build/bankAA.elf
  base_path: ../..
  platform: n64
  compiler: KMC

  asm_path: build/bankAA/asm
  build_path: build/bankAA
  asset_path: build/bankAA/assets
  ld_script_path: build/bankAA.ld
  undefined_syms_auto_path: build/bankAA/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankAA/undefined_funcs_auto.txt
  symbol_addrs_path:
    - config/symbols/symbol_addrs-bankAA.txt
  reloc_addrs_path:
    - config/symbols/reloc_addrs.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlAA_$VRAM"
  symbol_name_format_no_rom: "ovlAA_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  - type: bin
    start: 0x0
    vram: 0x0

  - name: bankRec9aa
    type: code
    start: 0x18f120
    vram: 0x80214fa0
    subsegments:
      - [0x18f120, asm]
      - [0x195310, data]

  - [0x195430]
