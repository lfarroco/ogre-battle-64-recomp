# Secondary splat config: streamed-overlay bank unit G (Phase 4).
#
# Unit G holds the *other* record-14 arena module: the one the game streams into
# the same RAM as bankRec14b (unit F) for the later steps of the New Game
# sequence, after the movie (scene 0x0D steps >= 2):
#
#   bankRec14c ROM 0x2A8CF0 (0x56A0) -> RAM 0x802395E0
#
# It exactly fills the ROM gap between unit-C's bankRec14a (ends 0x2A82F0 by
# DMA, 0x2A8CF0 by the segment table) and bankRec14b (starts 0x2AE390):
# 0x2A8CF0 + 0x56A0 == 0x2AE390. It is DMA'd in one 0x56A0 transfer, and the
# runtime registers it through the same streamed-DMA hook as every other record.
#
# See config/banks/config-bankF.yaml for why this module is not part of unit C.

name: Ogre Battle 64 - streamed overlay bank unit G
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankG
  target_path: assets/ogre64.z64
  elf_path: build/bankG.elf
  base_path: ../..
  symbol_addrs_path:
    - config/symbols/symbol_addrs.txt
  reloc_addrs_path:
    - config/symbols/reloc_addrs.txt
  platform: n64
  compiler: KMC

  asm_path: build/bankG/asm
  build_path: build/bankG
  asset_path: build/bankG/assets
  ld_script_path: build/bankG.ld
  undefined_syms_auto_path: build/bankG/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankG/undefined_funcs_auto.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlG_$VRAM"
  symbol_name_format_no_rom: "ovlG_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's rom position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # Record 14's arena module for the later 0x0D steps (all code, one DMA).
  - name: bankRec14c
    type: code
    start: 0x2A8CF0
    vram: 0x802395E0
    subsegments:
      - [0x2A8CF0, asm]

  # bankRec14b's ROM follows (unit F); not part of this unit.
  - type: bin
    start: 0x2AE390
    vram: 0x2AE390

  - [0x2B8B70]
