# N64Recomp config for streamed-overlay bank unit K (Phase 4).
# See config/banks/config-bankC.toml for the model; this unit holds bankRec14d, the third
# bank of the record-14 arena at RAM 0x8022ACB0 (the New Game sequence step
# whose command is -8 — the "Prologue" chapter animation after the closing
# movie). Unit L holds bankRec14a, the other bank of the same RAM.

[input]
output_func_path = "../../BankKFuncs"
elf_path = "../../build/bankK.elf"
rom_file_path = "../../assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

# Splat is run with the game's own code/data boundary (ROM 0x299D20), so in
# principle no override is needed. Any cap it still applies to a piece that
# ends in the middle of a call-and-continue emission has to be extended here
# (the failure is "use of undeclared label" at the `goto after_N`).
function_sizes = []
