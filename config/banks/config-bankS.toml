# N64Recomp config for streamed-overlay bank unit S (Phase 4).
# See config/banks/config-bankR.toml for the model. This unit holds the module scene 0x06
# ("Organize Screen") streams when it is entered:
#   ROM 0x87220 (0x56D60) -> RAM 0x8019A7C0 (see config/banks/config-bankS.yaml).

[input]
output_func_path = "../../BankSFuncs"
elf_path = "../../build/bankS.elf"
rom_file_path = "../../assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
