# Secondary splat config: streamed-overlay bank unit S (Phase 4).
#
# Unit S holds the module **scene `0x06` streams into RAM `0x8019A7C0`** — the
# screen the player gets by picking **"Organize Screen"** from the unit action
# menu in a mission (`Z`-panel / `START` menu → right → A), and the screen the
# natural `map -> mission` route passes through before the battle.
#
# Instruction level (scene `0x06`'s enter `func_8017B6D0`, `.streamedB`):
#
#   0x8017B6D8  a0 = 0x8019A7C0, a1 = 0x801FE0E0   -> icache invalidate
#   0x8017B708  a0 = 0x00087220, a1 = 0x8019A7C0
#               a2 = 0x000DDF80-0x00087220 = 0x56D60
#               (`subu` at 0x8017B724)              -> func_8009DA50: DMA 0x56D60
#   0x8017B728  bss range 0x801F1520..0x801F1520 (a0 == a1, the beql skips the
#               bzero)                              -> no BSS
#   0x8017B774  jal 0x801C19B0                     -> the module's entry
#   0x8017B77C  *(0x801977E8) = 2                  -> the scene-state the generic
#                                                      update/hook switch on
#
# So the module owns RAM `0x8019A7C0 .. 0x801F1520` (0x56D60 bytes, no BSS) and
# its entry is `0x801C19B0`. The three entry points resident code calls are
# forced in `config/symbols/symbol_addrs-bankS.txt`:
#
#   update `func_8017B858` state 2 -> `jal 0x801C214C`  (0x8017B8F4)
#   hook   `func_8017B9C8` state 2 -> `jal 0x801B7FC0`  (0x8017BA24)
#   enter  `func_8017B6D0`         -> `jal 0x801C19B0`  (0x8017B774)
#
# **The RAM is a swappable arena, not unit S's private range.** The same window
# is where record 7 (`0x101D00` -> 0x801AD5C0, 0x43530), record 3
# (`0x0EBBD0` -> 0x8019EE70), overlay C (`0x1CE040` -> 0x80197B90) and units H
# (`0x712A0`) and M (`0x79750`) live, so unit S must be its own unit and never
# compile into the unit whose code calls it (session 45/55/59/68 rule). The
# game re-DMAs the mission's banks on the way back out of scene `0x06` (measured:
# `[bank] loading overlay record` for 0x0E4910/0x0EBBD0/0x101D00 within the same
# frame as the `0x06 -> 0x03` transition), so the runtime's DMA-driven bank map
# picks the right bank in both directions.
#
# Found (session 69) by driving `tutorial -> practice stage -> mission` and
# pressing A on the menu entry: the run logged
#
#   [scene] t=334853ms id=0x0006 descriptor=0x8018FD84 mask=0x00000002
#   [bank] UNKNOWN module rom=0x087220 ram=0x8019A7C0
#   [overlays] streamed function stub called @ 0x801C19B0 (not yet loaded)
#   [overlays] streamed function stub called @ 0x801C214C (not yet loaded)
#   [scene] t=334921ms id=0x0003            <- the 68 ms bounce that "reloads"
#
# (The run also reports a second `UNKNOWN module rom=0x09A020 ram=0x801AD5C0`.
# That one is a **false positive** of the port's chunk-DMA heuristic: the game
# copies a record in 0x200-byte chunks and `0x9A020-0x87220 == 0x12E00 ==
# 0x801AD5C0-0x8019A7C0`, so chunk 151 of *this* DMA lands exactly on another
# module's base. There is only one uncompiled module here.)
#
# Code/data: the whole module is disassembled as `asm` (the unit-P/R treatment —
# spimdisasm splits the embedded data itself). The module's last `jr ra` is at
# RAM 0x801EE0D0 (ROM 0xDAB30) and the ROM span is 0x56D60, a multiple of 16, so
# the assembler adds no `.text` pad (session 65's +8 trap).
#
# See config/banks/config-bankA.yaml for the model.

name: Ogre Battle 64 - streamed overlay bank unit S
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankS
  target_path: assets/ogre64.z64
  elf_path: build/bankS.elf
  base_path: ../..
  platform: n64
  compiler: KMC

  asm_path: build/bankS/asm
  build_path: build/bankS
  asset_path: build/bankS/assets
  ld_script_path: build/bankS.ld
  undefined_syms_auto_path: build/bankS/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankS/undefined_funcs_auto.txt
  symbol_addrs_path:
    - config/symbols/symbol_addrs-bankS.txt
  reloc_addrs_path:
    - config/symbols/reloc_addrs.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlS_$VRAM"
  symbol_name_format_no_rom: "ovlS_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's ROM position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # Scene 0x06's module: everything scene 0x06's enter DMAs (ROM 0x87220,
  # 0x56D60). Unit M's bankRec05 ends at 0x87220, so the two units tile the ROM.
  - name: bankRec06
    type: code
    start: 0x87220
    vram: 0x8019A7C0
    subsegments:
      - [0x87220, asm]

  # The enter's `subu` ends here (ROM 0xDDF80); bound the subsegment so it
  # cannot run to the end of the ROM.
  - [0xDDF80]
