# Secondary splat config: streamed-overlay bank unit AC (Phase 4).
#
# Unit AC holds one bank of record 9's arena at RAM 0x80214FA0 (the arena
# units P/Q/R/V/W and their siblings share):
#
#   rec9ac  ROM 0x19c730 (0x064c0) -> RAM 0x80214fa0
#
# Found (session 72) by enumerating every `func_8009DA50` arena load in unit N's
# record 7 (`func_ovlN_801AExxx`); record 9's arena has **thirteen** banks and
# the port had compiled only five:
#
#   0x165FE0 Q   0x171EC0 P   0x177EF0 AC   0x17F9E0 W   0x188B80 ..
#   0x18F120 ..  0x195430 R   0x1977B0 ..        0x19C730 ..  0x1A2BF0 ..
#   0x1A4BE0 V   0x1A9260 ..  0x1B2640 ..
#
# The loader (unit N's `func_800900C0`/`func_80090010`/`func_8009DA50`/
# `func_80093380` arm) gives the game's own boundaries:
#
#   code  RAM 0x80214fa0..0x8021b3b0  ROM 0x19c730..0x1a2b40
#   data  RAM ..0x8021b460            ROM ..0x1a2bf0
#   DMA   func_8009DA50(0x19c730, 0x80214fa0, 0x64c0)
#   bss   RAM 0x8021b460..0x8021b530
#
# Code size 0x6410 is a multiple of 16 (no assembler pad).
#
# See config-bankA.yaml for the model.

name: Ogre Battle 64 - streamed overlay bank unit AC
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankAC
  target_path: assets/ogre64.z64
  elf_path: build/bankAC.elf
  base_path: .
  platform: n64
  compiler: KMC

  asm_path: build/bankAC/asm
  build_path: build/bankAC
  asset_path: build/bankAC/assets
  ld_script_path: build/bankAC.ld
  undefined_syms_auto_path: build/bankAC/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankAC/undefined_funcs_auto.txt
  symbol_addrs_path:
    - symbol_addrs-bankAC.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlAC_$VRAM"
  symbol_name_format_no_rom: "ovlAC_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  - type: bin
    start: 0x0
    vram: 0x0

  - name: bankRec9ac
    type: code
    start: 0x19c730
    vram: 0x80214fa0
    subsegments:
      - [0x19c730, asm]
      - [0x1a2b40, data]

  - [0x1a2bf0]
