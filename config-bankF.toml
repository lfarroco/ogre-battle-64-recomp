# N64Recomp config for streamed-overlay bank unit F (Phase 4).
# See config-bankC.toml for the model; this unit holds bankRec14b, one of the
# two record-14 arena modules that share RAM 0x802395E0 (the other is unit G's
# bankRec14c, and unit C holds the rest of record 14).

[input]
output_func_path = "BankFFuncs"
elf_path = "build/bankF.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

# splat carves rec14b's flow into pieces that N64Recomp cannot compile alone:
# each piece is capped in the middle of a call-and-continue emission, so the
# `goto after_N` has no label and the build fails with "use of undeclared
# label". The remedy is the shared one: extend each piece to the next real
# function entry (a stack prologue). N64Recomp redirects calls to swallowed
# symbols into the extended body (resolve_jal/has_size_override), so no map
# entry is lost. These three overrides moved here with bankRec14b (session 45);
# they were in config-bankC.toml while the record was part of unit C.
function_sizes = [
    # Mid-flow piece ending in the 0x8023CA08 call; real entry at 0x8023CA1C.
    { name = "func_ovlF_8023C9F4", size = 0x28 },
    # Real entry (prologue) ending in the 0x8023A180 call; the 0x8023A184
    # fragment follows, then the real entry func_ovlF_8023A1D8.
    { name = "func_ovlF_80239D68", size = 0x470 },
    # Mid-flow piece ending in the 0x8023E2DC call; fragments follow until the
    # real entry func_ovlF_8023E520.
    { name = "func_ovlF_8023E070", size = 0x4B0 },
]
