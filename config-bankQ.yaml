# Secondary splat config: streamed-overlay bank unit Q (Phase 4).
#
# Unit Q holds the **second** module the mission scene (0x03) streams into
# record 9's arena. Unit P (config-bankP.yaml) is the third; the ROM is tiled:
#
#   rec9     ROM 0x14EC00 (0x173E0) -> RAM 0x801FDA90   (unit N)
#   rec9c    ROM 0x165FE0 (0x0BEE0) -> RAM 0x80214FA0   (this unit)
#   rec9b    ROM 0x171EC0 (0x06200) -> RAM 0x80214FA0   (unit P)
#
# All three of rec9c/rec9b start at RAM 0x80214FA0 — they are banks of that
# arena (which unit C's bankRec12 also owns at 0x8020A300..0x80220CC0), so each
# gets its own unit and the runtime's DMA-driven bank map picks the resident one.
#
# Found (session 67) the same way as unit P: with records 7/8/9 compiled the
# mission no longer crashed, but the port logged
# `[overlays] streamed function stub called @ 0x8021954C` /
# `@0x80216DC0` / `@0x8021DC80` — addresses past record 9's declared size with
# real MIPS at them. A light probe in the runtime's `do_rom_read` (the full
# `OGRE_DMA_TRACE` perturbs the run enough to take the *other* bank) printed the
# transfer: `rom=0x165FE0 ram=0x80214FA0` in 0x200-byte chunks, rom up to
# 0x171EC0.
#
# Code to the module's last `jr ra` (ROM 0x16FBC8, delay slot 0x16FBCC, ends
# 0x16FBD0), then its data half to the end.
#
# See config-bankA.yaml for the model.

name: Ogre Battle 64 - streamed overlay bank unit Q
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankQ
  target_path: assets/ogre64.z64
  elf_path: build/bankQ.elf
  base_path: .
  platform: n64
  compiler: KMC

  asm_path: build/bankQ/asm
  build_path: build/bankQ
  asset_path: build/bankQ/assets
  ld_script_path: build/bankQ.ld
  undefined_syms_auto_path: build/bankQ/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankQ/undefined_funcs_auto.txt
  symbol_addrs_path:
    - symbol_addrs-bankQ.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlQ_$VRAM"
  symbol_name_format_no_rom: "ovlQ_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  - type: bin
    start: 0x0
    vram: 0x0

  - name: bankRec9c
    type: code
    start: 0x165FE0
    vram: 0x80214FA0
    subsegments:
      - [0x165FE0, asm]
      - [0x16FBD0, data]

  # Unit P's module follows in the ROM (0x171EC0..0x1780C0).
  - [0x171EC0]
