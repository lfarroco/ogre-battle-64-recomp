# Secondary splat config: streamed-overlay bank unit B (Phase 4).
#
# Unit B holds exactly the two records scene 0x17 asks for. That scene is one of
# the title screen's menu entries (its transition handler maps selection state 3
# -> scene 0x17), and before this unit existed it entered the scene, reported
# both records as UNCOMPILED, and idled: their stubs return and nothing draws.
#
#   rec17 ROM 0x069920 (0x4D60) -> RAM 0x80197B90, ram_end 0x8019C950 (bss 0x60)
#   rec18 ROM 0x1BA020 (0x92B0) -> RAM 0x80220F60, ram_end 0x80230600 (bss 0x6400)
#
# Both ranges are *disjoint from each other*, so one unit can hold both:
#
#   rec17 0x80197B90..0x8019C950 overlaps records 0/1/2/15 (all at 0x80197B90),
#         so it cannot share an ELF with units A, C, D or E.
#   rec18 0x80220F60..0x80230600 overlaps unit C's records 12 (tail), 13 and 16,
#         so it cannot share an ELF with unit C.
#
# RAM_END in tools/gen_bank_funcs.py carries the authoritative record ends from
# the game's segment table at ROM 0x387C0 (0x28-byte entries); the loader zeroes
# [ram start + size, ram end) as BSS on every load.
#
# The code/data split follows the established convention (see config-bankA/C):
# the code range ends at the last `jr $ra` + its delay slot, rounded up to the
# next 0x10 boundary (the same two zero padding words records 0/1 include):
#
#   rec17 code ..0x06DFA0 (last jr 0x06DF90), data 0x06DFA0..0x06E680
#   rec18 code ..0x1C2D90 (last jr 0x1C2D88), data 0x1C2D90..0x1C32D0
#
# See config-bankA.yaml for the model, and docs/DECISIONS.md (session 33).

name: Ogre Battle 64 - streamed overlay bank unit B
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankB
  target_path: assets/ogre64.z64
  elf_path: build/bankB.elf
  base_path: .
  platform: n64
  compiler: KMC

  asm_path: build/bankB/asm
  build_path: build/bankB
  asset_path: build/bankB/assets
  ld_script_path: build/bankB.ld
  undefined_syms_auto_path: build/bankB/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankB/undefined_funcs_auto.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlB_$VRAM"
  symbol_name_format_no_rom: "ovlB_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's rom position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # Bank record 17 (scene 0x17's first record).
  - name: bankRec17
    type: code
    start: 0x069920
    vram: 0x80197B90
    subsegments:
      - [0x069920, asm]
      - [0x06DFA0, data]

  # Gap: records 1..16 and overlay C live here and are covered by other units.
  - type: bin
    start: 0x06E680
    vram: 0x06E680

  # Bank record 18 (scene 0x17's second record).
  - name: bankRec18
    type: code
    start: 0x1BA020
    vram: 0x80220F60
    subsegments:
      - [0x1BA020, asm]
      - [0x1C2D90, data]

  # Rest of the ROM: not part of this unit.
  - [0x1C32D0]
