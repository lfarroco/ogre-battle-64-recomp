# Config file for Ogre Battle 64 - Person of Lordly Caliber (USA) (Rev A) recompilation.
# Generated from the splat disassembly (see config.yaml). Entry point 0x80070C00
# comes from the cart header; main() is at 0x8007F880.

[input]
entrypoint = 0x80070C00
# Paths are relative to the location of this config file.
output_func_path = "RecompiledFuncs"
elf_path = "build/ogrebattle64.elf"
rom_file_path = "assets/ogre64.z64"
relocatable_sections_path = "relocatable_sections.txt"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100
# func_8019ABC4's epilogue (s5-s0 restores, sp restore, jr ra) was split by
# splat into a separate func_8019AF0C symbol (a shared epilogue also tail-called
# from overlay B, so the symbol must stay). Without this override N64Recomp
# truncates func_8019ABC4 at 0x348, dropping the restores: every call clobbers
# the caller's s-regs (session-16 boot death: s1 wild -> OOB store in
# func_8019FC68). Extend through the 0x20-byte epilogue.
function_sizes = [
    { name = "func_8019ABC4", size = 0x368 },
    { name = "func_8019A1B4", size = 0xA10 },
    # func_80197C94 jumps to 0x801985D8, which lies inside the *next* real
    # function (func_801980A0). Session 30 "fixed" that by extending
    # func_80197C94 to 0x948, but that swallows func_801980A0 whole: the latter's
    # body and epilogue (0x801980A0..0x801985F0) were compiled as internal labels
    # and func_801980A0 itself became a ~0x10-byte stub, so every caller returned
    # with an unbalanced frame (session 31: $s3 = 0x310 -> SIGSEGV in
    # func_801A1FCC). 0x40C is the real size (the gap to the next symbol); the
    # 0x801985D8 epilogue is reached by tail-calling the discovered static there.
    { name = "func_80197C94", size = 0x40C },
    { name = "func_801A1034", size = 0x13C },
    { name = "func_801989AC", size = 0x520 },
    { name = "func_8019A7C0", size = 0x404 },
    { name = "func_8019AF5C", size = 0x118 },
    { name = "func_8019B300", size = 0x3F8 },
    { name = "func_8019C188", size = 0x44C },
    { name = "func_8019D568", size = 0xCB0 },
    # func_801AB76C is a 4-byte splat artifact: 0x801AB76C is the `addiu sp,sp,56`
    # delay slot of func_801AB568's `jr ra` (its ELF symbol size is 4). The old
    # 0x22C override ran to func_801AB998's start, so 0x801AB770 — the *real*
    # next function (ELF size 0x228, its own prologue/epilogue) — fell strictly
    # inside it. find_containing_size_override then redirected every
    # `jal 0x801AB770` into func_801AB76C and emitted it as call-plus-early-
    # `return`, leaking the caller's frame. The credits hook (scene 0x11) reaches
    # func_801AB998 -> `jal 0x801AB770`, so the leak hit the frame-pump thread
    # (t4) and the credits froze with no display lists (D_800AEFA4 stuck while
    # D_800C4BCC counts) — session 86. Trimmed to the ELF size; same class as
    # func_801AFC2C below (session 41).
    { name = "func_801AB76C", size = 0x4 },
    { name = "func_801AFAF4", size = 0x5E0 },
    # func_801B00D0 is a 4-byte splat artifact: 0x801B00D0 is the `addiu sp,sp,0x80`
    # delay slot of func_801AFC2C's `jr ra` (ELF size 4). The old 0x544 override ran
    # to 0x801B0614, so the *real* next function at 0x801B00D4 (ELF size 0x540, its
    # own prologue `addiu sp,sp,-0x78`) fell strictly inside it.
    # find_containing_size_override then redirected every `jal 0x801B00D4` into
    # func_801B00D0 and emitted it as call-plus-early-`return`, leaking the caller's
    # frame. func_801B1BBC (overlay C, on the credits call tree) is such a caller,
    # so the frame pump (t4) died at the credits (D_800AEFA4 frozen while
    # D_800C4BCC counts) — session 86. The `jal 0x801B00D0` sites (scene 0x0D's
    # leave) stay dispatched at run time via the Makefile's --only list, so this
    # does not change their binding. Same class as func_801AFC2C below (session 41).
    { name = "func_801B00D0", size = 0x4 },
    { name = "func_801B7F14", size = 0x154 },
    # func_8019C5D4 must NOT be extended over func_8019C69C (session 39):
    # 0x8019C69C is a genuine alternate entry with its own caller
    # (func_8017BB28's jal, the menu 0x18 path), entered with the caller's
    # registers/frame. Extending 0x8019C5D4 to 0x5D8 made N64Recomp redirect
    # that jal into the head, which derives s0 from a0 via D_801B80E0 and
    # faults at N64 0xFC. Split, the head reaches the shared tail through
    # static tail-calls and the direct jal lands on the real entry.
    # func_801AB568's real body runs to 0x801AB770 (0x208): splat cut its
    # epilogue into the bogus `func_801AB740`/`func_801AB76C` symbols and the
    # ELF size 0x1D8 stops at 0x801AB740, mid-epilogue. At 0x1E0 the override
    # ended at 0x801AB748, so the continuation (`static_16_801AB748`) did the
    # s-register restores and `jr ra` but took its `addiu sp,sp,56` delay slot
    # from func_801AB76C's range — the delay slot was dropped, and every call
    # returned with sp 0x38 too low, corrupting the caller's saved $ra/$s1.
    # The credits path calls it (scene 0x11), so the frame pump (t4) died after
    # ~100 frames (D_800AEFA4 frozen while D_800C4BCC counts) — session 86.
    # Extended through the epilogue exactly as func_8019ABC4 is.
    { name = "func_801AB568", size = 0x208 },
    { name = "func_801AB740", size = 0x30 },
    # func_801AFC2C's real body runs to 0x801B00D4 (0x4A8): the 0x801B00D0
    # `addiu sp,sp,0x80` is its own `jr ra` delay slot (the ELF size 0x4A4 stops
    # one instruction short), so at 0x4A4 the delay slot was dropped and the
    # function returned with sp 0x80 too low, corrupting its caller's frame.
    # Session 41 trimmed it to 0x4A4 only to stop `jal 0x801B00D0` (scene 0x0D's
    # leave, 0x80178BB8) being redirected into it; that call is now dispatched at
    # run time (Makefile --only 0x801B00D0, which rewrites it to LOOKUP_FUNC and
    # overrides the recompiler's binding), so including the delay slot is safe
    # again. (Session 41's comment: the 0x4A8 override made find_containing_size_
    # override redirect `jal 0x801B00D0` into func_801AFC2C instead of the real
    # bank entry.)
    { name = "func_801AFC2C", size = 0x4A8 },
    { name = "func_801B8068", size = 0x2C },
]

# The game's main() is renamed to avoid conflicting with the C entry point.
[patches]
renamed = ["main"]
