# N64Recomp config for streamed-overlay bank unit T (Phase 4).
# See config-bankR.toml for the model. This unit holds the tutorial practice
# module record 18 streams into its own arena when the tutorial (scene 0x17)
# opens a practice stage:
#   ROM 0x1C32D0 (0x5D50) -> RAM 0x8022A860 (see config-bankT.yaml).

[input]
output_func_path = "BankTFuncs"
elf_path = "build/bankT.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100

function_sizes = []
