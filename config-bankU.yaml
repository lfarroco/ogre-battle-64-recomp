# Secondary splat config: streamed-overlay bank unit U (Phase 4).
#
# Unit U holds the **third** bank of record 18's arena — the module the
# tutorial's mode table selects when `D_80193700 == 2` (unit T holds
# `D_80193700 == 1`, the practice bank; record 18 itself is unit B):
#
#   rec18   ROM 0x1BA020 (0x92B0) -> RAM 0x80220F60..0x8022A210   (unit B)
#   rec18b  ROM 0x1C32D0 (0x5D50) -> RAM 0x8022A860..0x802305B0   (unit T)
#   rec18c  ROM 0x1C9020 (0x5020) -> RAM 0x8022A860..0x8022F880   (this unit)
#
# The loader is record 18's `func_ovlB_80221D50`, which indexes two tables by
# `D_80193700`: the 0x28-byte segment descriptors at RAM 0x80229DDC and the
# 0x1C-byte mode records at RAM 0x80229E88. For index 2 the segment descriptor
# is at 0x80229E2C:
#
#   { ram 0x8022A860, ram_end 0x8022F880, rom 0x001C9020, rom_end 0x001CE040,
#     bss 0x8022F880 (empty), code 0x8022A860..0x8022AA00,
#     data 0x8022AA00..0x8022F880 }
#
# and the mode record at 0x80229EC0 calls its +0x08 word 0x8022A87C (a bare
# `jr ra` — this bank is mostly the mode's data, only 0x1A0 bytes of code).
#
# Why it is a unit even though no observed route loads it: the RAM is shared
# with unit T (0x8022A860), unit L's bankRec14a (0x8022ACB0), record 18's BSS
# and unit C's record 14 arena. When the game streams one bank over another, the
# runtime's DMA-driven bank map must evict the previous bank's functions —
# otherwise a mode-2 visit would run unit T's bodies at these addresses (the
# session-45/59/67 mis-binding class). Compiling it makes that swap correct.
#
# Found (session 71) from unit T's loader table alongside the practice bank; the
# two tutorial options that were driven both selected index 0 (normal mission,
# descriptor 0x8018F350) and index 1 (practice, 0x8018F364), so index 2 is not
# yet exercised in a run. See config-bankT.yaml.
#
# Code/data: the split is the loader table's own `code_end` 0x8022AA00 = ROM
# 0x1C91C0 (the last `jr ra` is 0x1C91B0 plus its delay slot); code size 0x1A0
# is a multiple of 16, so the assembler adds no `.text` pad.

name: Ogre Battle 64 - streamed overlay bank unit U
sha1: d26b14bee422a09581ce438d45ba9fec9783fbb8
options:
  basename: ogrebankU
  target_path: assets/ogre64.z64
  elf_path: build/bankU.elf
  base_path: .
  platform: n64
  compiler: KMC

  asm_path: build/bankU/asm
  build_path: build/bankU
  asset_path: build/bankU/assets
  ld_script_path: build/bankU.ld
  undefined_syms_auto_path: build/bankU/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/bankU/undefined_funcs_auto.txt
  symbol_addrs_path:
    - symbol_addrs-bankU.txt

  find_file_boundaries: True
  header_encoding: ASCII
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_name_format: "ovlU_$VRAM"
  symbol_name_format_no_rom: "ovlU_$VRAM"

  extensions_path: tools/splat_ext
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: False

segments:
  # Unused ROM prefix, covered as one opaque bin so splat's ROM position
  # tracking stays consistent. Never linked into the app.
  - type: bin
    start: 0x0
    vram: 0x0

  # The mode-2 bank: code to the loader table's code_end (ROM 0x1C91C0), then
  # the data half.
  - name: bankRec18c
    type: code
    start: 0x1C9020
    vram: 0x8022A860
    subsegments:
      - [0x1C9020, asm]
      - [0x1C91C0, data]

  # Overlay C (ROM 0x1CE040) begins here; not part of this unit.
  - [0x1CE040]
