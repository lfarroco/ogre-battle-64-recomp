# N64Recomp config for streamed-overlay bank unit G (Phase 4).
# See config-bankF.toml for the model; this unit holds bankRec14c, the
# record-14 arena module the game streams over bankRec14b's RAM for scene 0x0D
# steps >= 2 (after the New Game movie).

[input]
output_func_path = "BankGFuncs"
elf_path = "build/bankG.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100
