# N64Recomp config for streamed-overlay bank unit C (Phase 4).
# See config-bankA.toml for the model; this unit holds records 10, 11, 12, 13.

[input]
output_func_path = "BankCFuncs"
elf_path = "build/bankC.elf"
rom_file_path = "assets/ogre64.z64"
use_absolute_symbols = true
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
functions_per_output_file = 100
